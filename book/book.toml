[book]
title = "Codex CLI 源码深度解读"
authors = ["Codex 源码学习笔记"]
description = "面向入门级 Agent 开发者的 OpenAI Codex CLI（codex-rs）源码精读：从一次对话的生命周期，到 Agent Loop、工具系统与安全模型"
language = "zh"
src = "src"
multilingual = false

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/Atituiset/codex"
edit-url-template = "https://github.com/Atituiset/codex/edit/main/book/src/{path}"
site-url = "/codex/"
cname = ""
mathjax-support = false

[preprocessor.index]
